plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

group = 'com.jobsity'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'com.twilio.sdk:twilio:13.2.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    standardInput = System.in
}

jib {
    from {
        image = 'eclipse-temurin:21-jre'
        platforms {
            platform {
                architecture = findProperty('jibArch') ?: (System.getProperty('os.arch') == 'aarch64' ? 'arm64' : 'amd64')
                os = 'linux'
            }
        }
    }
    to {
        image = findProperty('jibImage') ?: "${project.name}:${project.version}"
    }
    container {
        mainClass = 'com.jobsity.birthdayscheduler.BirthdaySchedulerApplication'
        workingDirectory = '/app/data'
        environment = [
            'SPRING_DATASOURCE_URL': 'jdbc:sqlite:/app/data/birthday-scheduler.db'
        ]
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}
