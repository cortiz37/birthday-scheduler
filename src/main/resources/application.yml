spring:
  application:
    name: birthday-scheduler
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    url: "jdbc:sqlite:dev.db"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

app:
  friends:
    source: ${APP_FRIENDS_SOURCE:sqlite}
    file-location: ${APP_FRIENDS_FILE:classpath:friends.txt}
  mail:
    from: ${APP_MAIL_FROM:myaccount@server.com}
    template-birthday-subject: "Happy birthday!"
    template-birthday: birthday-email.ftl
    template-birthday-reminder-subject: "Birthday Reminder"
    template-birthday-reminder: birthday-reminder-email.ftl
  birthday-scheduler:
    schedule:
      cron: "${APP_BIRTHDAY_SCHEDULER_CRON:0 0 0 * * *}"
